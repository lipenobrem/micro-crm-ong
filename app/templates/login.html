<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | ONG Esperança</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #001f3f 0%, #005953 100%);
        }
        .login-wrapper {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .login-wrapper h2 {
            color: #001f3f;
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 800;
        }
        .login-wrapper p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .erro {
            color: #ef4444;
            background-color: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #005953;
            box-shadow: 0 0 0 3px rgba(0, 89, 83, 0.1);
        }
        button {
            background: linear-gradient(135deg, #001f3f, #005953);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 89, 83, 0.2);
        }
        .back-link {
            display: block;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }
        .back-link:hover { color: #001f3f; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <h2>Acesso de Administrador</h2>
        <p>Insira a credencial do administrador</p>
        
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        
        <form action="{{ url_for('web.login') }}" method="POST">
            <input type="password" name="senha" placeholder="Digite a senha" required>
            <button type="submit">Entrar no Painel</button>
        </form>

        <a href="{{ url_for('web.home') }}" class="back-link">← Voltar para o início</a>
    </div>
</body>
</html>
